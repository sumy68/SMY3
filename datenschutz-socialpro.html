<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datenschutz – SocialPro | SMY Agency</title>
  <meta name="description" content="Datenschutzerklärung für die App SocialPro (SMY Agency): Datenverarbeitung, API-Verbindungen zu Instagram, TikTok, LinkedIn, Facebook und Zahlungen." />
  <link rel="canonical" href="https://smyagency.de/datenschutz-socialpro.html" />
  <link rel="alternate" hreflang="de" href="https://smyagency.de/datenschutz-socialpro.html" />
  <link rel="alternate" hreflang="en" href="https://smyagency.de/datenschutz-socialpro.html?lang=en" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .gradient-text { background: linear-gradient(to right, #D4AF37, #FFD700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .lang-btn[aria-current="true"] { outline: 2px solid #D4AF37; }
    a { text-decoration: underline; }
  </style>
</head>
<body class="bg-[#f4f1e8] text-black scroll-smooth">

  <!-- Header -->
  <header class="flex items-center justify-between px-6 py-4 bg-white/70 backdrop-blur sticky top-0 z-40 shadow">
    <h1 class="text-2xl font-extrabold gradient-text">SMY Agency</h1>
    <div class="flex items-center gap-2">
      <button class="lang-btn rounded-xl px-3 py-1 text-sm hover:bg-white" data-lang="de" aria-current="true">DE</button>
      <button class="lang-btn rounded-xl px-3 py-1 text-sm hover:bg-white" data-lang="en">EN</button>
    </div>
  </header>

  <main id="content" class="max-w-4xl mx-auto px-6 py-12 space-y-10">
    <!-- Inhalt wird dynamisch eingefügt -->
  </main>

  <footer class="py-8 bg-[#f4f1e8] text-gray-600 text-sm">
    <div class="max-w-6xl mx-auto px-4 text-center space-y-4">
      <p class="text-gray-500">© 2025 Sümeyye Abur – SMY Agency. Alle Rechte vorbehalten.</p>
    </div>
  </footer>

  <script>
    const texts = {
      de: `
        <h2 class="text-3xl font-extrabold text-[#D4AF37] mb-2">Datenschutzerklärung für die App SocialPro</h2>
        <p class="text-gray-700 mb-6">Stand: 05. Dezember 2025</p>

        <section>
          <h3 class="text-2xl font-bold mb-2">1. Verantwortliche Stelle</h3>
          <p>Sümeyye Abur<br>Ursinusstraße 7<br>85077 Manching / Deutschland<br>
          E-Mail: <a href="mailto:info@smyagency.de">info@smyagency.de</a><br>
          Tel.: +49 1523 6137216</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">2. Erhobene Daten und Zweck</h3>
          <ul class="list-disc pl-6 space-y-2">
            <li><strong>Social-Media-Zugangsdaten / Tokens:</strong> Für die Verbindung mit Instagram, TikTok, LinkedIn und Facebook nutzt SocialPro die offiziellen APIs dieser Plattformen. Die App erhält Zugriffstoken, um Posts zu planen, zu veröffentlichen und Performance-Daten zu analysieren. Passwörter werden nicht im Klartext gespeichert.</li>
            <li><strong>Fotos & Videos:</strong> Von dir hochgeladene Inhalte werden ausschließlich verwendet, um Social-Media-Posts zu erstellen und KI-generierte Texte (Captions, Hashtags) zu generieren.</li>
            <li><strong>Nutzungsdaten:</strong> Es werden technische Informationen (Gerätetyp, iOS-Version, Nutzungszeit, Fehlerprotokolle) erfasst, um Stabilität und Leistung zu verbessern.</li>
            <li><strong>Zahlungsdaten:</strong> Käufe und Abonnements werden über Apple In-App-Purchase abgewickelt. SMY Agency erhält keine Zahlungsdaten.</li>
          </ul>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">3. Rechtsgrundlage</h3>
          <p>Art. 6 Abs. 1 lit. b DSGVO (Vertragserfüllung) und Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse). Eine Einwilligung (Art. 6 Abs. 1 lit. a DSGVO) wird eingeholt, wenn du der Verknüpfung deiner Konten zustimmst.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">4. Speicherdauer</h3>
          <p>Daten werden gelöscht, sobald du dein Konto trennst oder dein Nutzerkonto löschst. Backups werden nach 30 Tagen entfernt.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">5. Weitergabe an Dritte</h3>
          <p>Es erfolgt keine Weitergabe an Dritte außerhalb der API-Schnittstellen der Social-Media-Plattformen. Diese unterliegen den Datenschutzbestimmungen der jeweiligen Anbieter.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">6. KI-Verarbeitung</h3>
          <p>Zur Texterstellung nutzt SocialPro interne KI-Algorithmen. Medien werden nach der Analyse gelöscht. Keine Weitergabe an externe KI-Dienste.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">7. Zahlungen und Abos</h3>
          <p>Die Zahlungsabwicklung erfolgt ausschließlich über Apple. SMY Agency speichert keine Kreditkartendaten. Abo-Informationen (Laufzeit, Status) werden nur lokal gespeichert.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">8. Rechte der Nutzer</h3>
          <p>Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Widerruf. Kontakt: <a href="mailto:info@smyagency.de">info@smyagency.de</a></p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">9. Datensicherheit</h3>
          <p>Alle Verbindungen erfolgen verschlüsselt (TLS). Serverstandort: EU. Zugriffe sind durch Authentifizierung geschützt.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">10. Änderungen</h3>
          <p>Diese Erklärung kann angepasst werden. Letztes Update: 05.12.2025.</p>
        </section>
      `,
      en: `
        <h2 class="text-3xl font-extrabold text-[#D4AF37] mb-2">Privacy Policy for the App SocialPro</h2>
        <p class="text-gray-700 mb-6">Last updated: October 6, 2025</p>

        <section>
          <h3 class="text-2xl font-bold mb-2">1. Responsible Entity</h3>
          <p>Sümeyye Abur<br>Ursinusstraße 7<br>85077 Manching / Germany<br>
          Email: <a href="mailto:info@smyagency.de">info@smyagency.de</a><br>
          Tel.: +49 1523 6137216</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">2. Data Collected and Purpose</h3>
          <ul class="list-disc pl-6 space-y-2">
            <li><strong>Social Media Access Data / Tokens:</strong> SocialPro connects to Instagram, TikTok, LinkedIn, and Facebook via official APIs. Access tokens are used only to authenticate, schedule posts, and analyze performance. No passwords are stored in plain text.</li>
            <li><strong>Photos & Videos:</strong> Uploaded media is used solely to generate posts and AI-based captions or hashtags.</li>
            <li><strong>Usage Data:</strong> Technical data (device type, iOS version, session time, error logs) is collected to improve performance and reliability.</li>
            <li><strong>Payment Data:</strong> All purchases and subscriptions are processed via Apple In-App-Purchase. SMY Agency does not receive any credit card or banking data.</li>
          </ul>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">3. Legal Basis</h3>
          <p>Processing is based on Art. 6(1)(b) GDPR (contract performance) and Art. 6(1)(f) GDPR (legitimate interest). Consent (Art. 6(1)(a) GDPR) is obtained when connecting your accounts.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">4. Storage Duration</h3>
          <p>Data is deleted when you disconnect or delete your account. Backups are removed after 30 days.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">5. Data Sharing</h3>
          <p>No data is shared with third parties except for the required social media APIs. These providers operate under their own privacy policies.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">6. AI Processing</h3>
          <p>SocialPro uses internal AI algorithms to generate text suggestions. Media files are deleted after processing. No data is transferred to external AI providers.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">7. Payments and Subscriptions</h3>
          <p>Payments are handled exclusively through Apple. SMY Agency does not store payment data. Subscription details (duration, status) are stored locally.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">8. User Rights</h3>
          <p>You have the right to access, correct, delete, restrict, transfer, and withdraw your consent. Contact: <a href="mailto:info@smyagency.de">info@smyagency.de</a></p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">9. Data Security</h3>
          <p>All connections are encrypted (TLS). Servers are located within the EU. Access is secured via authentication.</p>
        </section>

        <section>
          <h3 class="text-2xl font-bold mb-2 mt-6">10. Updates</h3>
          <p>This policy may be updated. Last revision: October 6, 2025.</p>
        </section>
      `
    };

    function setLang(lang) {
      document.getElementById('content').innerHTML = texts[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn =>
        btn.setAttribute('aria-current', btn.dataset.lang === lang)
      );
      localStorage.setItem('lang', lang);
    }

    const current = localStorage.getItem('lang') || (navigator.language.startsWith('en') ? 'en' : 'de');
    setLang(current);

    document.querySelectorAll('.lang-btn').forEach(btn =>
      btn.addEventListener('click', () => setLang(btn.dataset.lang))
    );
  </script>
</body>
</html>
